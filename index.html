<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine ❤️</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  height: 100vh;
  background: linear-gradient(120deg, #ff9a9e, #fad0c4, #fbc2eb);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.card {
  width: 900px;
  height: 520px;
  background: linear-gradient(135deg, #ff5f7e, #ff9a9e);
  border-radius: 30px;
  padding: 50px;
  position: relative;
  color: white;
  box-shadow: 0 20px 50px rgba(0,0,0,0.25);
}

h1 {
  font-size: 48px;
  margin-bottom: 20px;
}

p {
  font-size: 19px;
  max-width: 450px;
  line-height: 1.7;
}

.buttons {
  margin-top: 40px;
}

button {
  padding: 14px 38px;
  border-radius: 30px;
  border: none;
  font-size: 18px;
  cursor: pointer;
}

#yes {
  background: white;
  color: #ff4d6d;
  margin-right: 20px;
}

#no {
  background: #ffd1dc;
  color: #ff4d6d;
  position: absolute;
}

.message {
  margin-top: 25px;
  font-size: 20px;
  height: 30px;
  opacity: 0.95;
}

/* Cute floating hearts */
.heart {
  position: absolute;
  font-size: 24px;
  animation: float 6s infinite ease-in-out;
}

@keyframes float {
  0% { transform: translateY(0); opacity: 0.4; }
  50% { transform: translateY(-25px); opacity: 1; }
  100% { transform: translateY(0); opacity: 0.4; }
}
</style>
</head>

<body>

<div class="card">
  <h1>Will you be my Valentine? ❤️</h1>

  <p>
    <span id="name"></span>,  
    I thought about this a lot before asking.  
    It’s simple, honest, and real.  
    I’d really like you to be my Valentine 💕
  </p>

  <div class="buttons">
    <button id="yes">Yes ❤️</button>
    <button id="no">No</button>
  </div>

  <div class="message" id="message"></div>

  <!-- hearts -->
  <div class="heart" style="top:10%; left:15%;">❤️</div>
  <div class="heart" style="top:70%; left:80%;">💖</div>
  <div class="heart" style="top:40%; left:90%;">💕</div>
</div>

<script>
/* 🔴 CHANGE NAME HERE ONLY */
const herName = "Your Beloved Name";

/* emotional messages */
const messages = [
  "Hey… please don’t say no 🥺",
  "I really mean this.",
  "It’s only you.",
  "I won’t stop choosing you.",
  "This is me asking from my heart ❤️"
];

document.getElementById("name").innerText = herName;

const noBtn = document.getElementById("no");
const messageBox = document.getElementById("message");

function moveNo() {
  const card = document.querySelector(".card");
  const maxX = card.clientWidth - noBtn.clientWidth;
  const maxY = card.clientHeight - noBtn.clientHeight;

  noBtn.style.left = Math.random() * maxX + "px";
  noBtn.style.top = Math.random() * maxY + "px";

  messageBox.innerText =
    messages[Math.floor(Math.random() * messages.length)];
}

noBtn.addEventListener("mouseover", moveNo);
noBtn.addEventListener("click", moveNo);

document.getElementById("yes").addEventListener("click", () => {
  document.body.innerHTML = `
    <div style="
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      background:linear-gradient(135deg,#ff758c,#ff7eb3);
      color:white;
      font-size:42px;
      font-family:Poppins;
    ">
      ❤️ ${herName} ❤️<br><br>
      Thank you for saying yes.<br>
      This means more than you know.
    </div>
  `;
});
</script>

</body>
</html>
